<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tankled Araç</title>
<meta name="description" content="Tankled araç sayfası." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#5c7a5a;
    --green-deep:#43603f;
    --green-dark:#33492f;
    --cream:#f4f1e9;
    --cream-2:#ffffff;
    --sand:#cbb98f;
    --sand-deep:#b8a371;
    --ink:#2b3329;
    --muted:#6f7a68;
    --on-green:#f3f1e7;
    --radius:30px;
    --radius-sm:18px;
    --maxw:1180px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    font-weight:300;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;flex-direction:column;
  }
  h1,h2,h3{font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--green-dark)}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px;width:100%}
  .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--sand-deep);font-weight:600;margin-bottom:14px;display:inline-block}
  .lead{color:var(--muted);font-size:clamp(15px,1.5vw,18px);max-width:54ch}

  .btn{
    display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:500;
    padding:12px 22px;border-radius:100px;border:1.5px solid rgba(67,96,63,.3);
    color:var(--green-deep);transition:background .3s,border-color .3s;
  }
  .btn:hover{border-color:var(--green);background:rgba(92,122,90,.08)}
  .btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}

  header{border-bottom:1px solid rgba(67,96,63,.1)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:88px}
  .logo img{height:56px;width:auto}

  main{flex:1;padding:56px 0 80px}
  .tool-card{
    margin-top:32px;background:var(--cream-2);border-radius:var(--radius);
    padding:clamp(20px,4vw,40px);box-shadow:0 20px 50px -30px rgba(51,73,47,.35);
    min-height:280px;
  }
  .placeholder{
    border:2px dashed rgba(67,96,63,.2);border-radius:var(--radius-sm);
    min-height:200px;display:grid;place-items:center;text-align:center;
    color:var(--muted);padding:24px;
  }

  footer{padding:24px 0;font-size:13px;color:var(--muted);border-top:1px solid rgba(67,96,63,.1)}

  @media (max-width:600px){
    .nav{height:72px}
    .logo img{height:44px}
    main{padding:36px 0 56px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a href="../" class="logo" aria-label="Tankled ana sayfa">
      <img src="../assets/logo.png" alt="Tankled Aquarium" />
    </a>
    <a href="../" class="btn">← Ana sayfa</a>
  </div>
</header>

<main>
  <div class="wrap">
    <span class="eyebrow">Tankled Araçları</span>
    <h1>Araç Adı</h1>
    <p class="lead" style="margin-top:14px">Aracın kısa açıklaması buraya gelecek.</p>

    <section class="tool-card" id="tool">
      <!-- Araç arayüzü buraya gelecek -->
      <div class="placeholder">Araç yakında burada olacak.</div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">© Tankled</div>
</footer>

<script>
  // Araç kodu buraya gelecek
</script>
</body>
</html>

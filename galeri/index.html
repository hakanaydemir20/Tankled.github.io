<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:#2b3329;font-family:'Poppins',sans-serif;font-weight:300;line-height:1.7;

  h1{font-weight:700;line-height:1.15;letter-spacing:-.02em;color:var(--green-dark);font-size:clamp(30px,5vw,48px)}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px;width:100%}
  .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--sand-deep);font-weight:600;margin-bottom:12px;display:inline-block}
  header{border-bottom:1px solid rgba(67,96,63,.1);background:var(--cream)}
  .nav{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;height:96px}
  .logo img{height:64px;width:auto}
  .back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--green-deep);
    padding:10px 20px;border-radius:100px;border:1.5px solid rgba(67,96,63,.25);transition:background .3s,border-color .3s;white-space:nowrap}
  .back:hover{border-color:var(--green);background:rgba(92,122,90,.08)}
  main{flex:1;padding:52px 0 80px}
  .intro{text-align:center;max-width:640px;margin:0 auto}
  .intro p{color:var(--muted);margin-top:12px}
  .grid{column-count:4;column-gap:14px;margin-top:40px}
  .item{position:relative;display:block;width:100%;border:0;padding:0;margin:0 0 14px;background:var(--green);cursor:zoom-in;
    overflow:hidden;border-radius:var(--radius-sm);break-inside:avoid;box-shadow:0 14px 30px -26px rgba(51,73,47,.6)}
  .item img{width:100%;height:auto;transition:transform .7s var(--ease)}
  .item:hover img{transform:scale(1.05)}
  @media(max-width:1100px){.grid{column-count:3}}
  @media(max-width:560px){.grid{column-count:3;column-gap:6px;margin-top:28px} .item{margin-bottom:6px;border-radius:8px}
    .nav{height:76px} .logo img{height:48px} .back{padding:9px 14px} main{padding:36px 0 60px}}
  .more{text-align:center;margin-top:32px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:100px;background:var(--green);
    color:var(--on-green);font-weight:600;font-size:14px;letter-spacing:.03em}
  .lightbox{position:fixed;inset:0;background:rgba(20,26,19,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-height:90vh;max-width:100%;border-radius:12px}
  footer{padding:24px 0;font-size:13px;color:var(--muted);text-align:center;border-top:1px solid rgba(67,96,63,.1)}
</style>

<div class="lightbox" id="lb" role="dialog" aria-label="Büyük görsel"><img alt="" /></div>
<footer><nav class="alt-nav" style="margin-bottom:6px"><a href="../">Ana sayfa</a> · <a href="../bitkiler/">Bitkiler</a> · <a href="../baliklar/">Balıklar</a> · <a href="../malzemeler/">Malzemeler</a> · <a href="../akvaryum-olustur/">3D Tasarım</a> · <a href="https://www.instagram.com/tankled.akvaryum/" target="_blank" rel="noopener">Instagram</a></nav>© <span id="year"></span> Tankled · El yapımı akvaryum, Ankara</footer>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
  document.querySelectorAll('.item').forEach(b => b.addEventListener('click', () => {
    const i = b.querySelector('img'); lbImg.src = i.src; lbImg.alt = i.alt; lb.classList.add('open');
  }));
  lb.addEventListener('click', () => lb.classList.remove('open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
